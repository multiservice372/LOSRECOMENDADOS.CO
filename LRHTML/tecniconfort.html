  <style>
    body {
      box-sizing: border-box;
    }
    
    * {
      scrollbar-width: thin;
      scrollbar-color: #06b6d4 #0f172a;
    }
    
    *::-webkit-scrollbar {
      width: 6px;
    }
    
    *::-webkit-scrollbar-track {
      background: #0f172a;
    }
    
    *::-webkit-scrollbar-thumb {
      background: #06b6d4;
      border-radius: 3px;
    }
    
    .glass {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(6, 182, 212, 0.2);
    }
    
    .glass-card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(6, 182, 212, 0.15);
    }
    
    .neon-glow {
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.3), 0 0 40px rgba(6, 182, 212, 0.1);
    }
    
    .neon-text {
      text-shadow: 0 0 10px rgba(6, 182, 212, 0.5), 0 0 20px rgba(6, 182, 212, 0.3);
    }
    
    .purple-glow {
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.3), 0 0 40px rgba(168, 85, 247, 0.1);
    }
    
    .gradient-border {
      position: relative;
    }
    
    .gradient-border::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, #06b6d4, #a855f7, #06b6d4);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }
    
    .animate-float {
      animation: float 6s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    
    .animate-pulse-slow {
      animation: pulse-slow 3s ease-in-out infinite;
    }
    
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    
    .animate-gradient {
      background-size: 200% 200%;
      animation: gradient-shift 8s ease infinite;
    }
    
    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #06b6d4, #0891b2);
      transition: all 0.3s ease;
    }
    
    .btn-primary:hover {
      background: linear-gradient(135deg, #22d3ee, #06b6d4);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(6, 182, 212, 0.4);
    }
    
    .btn-secondary {
      background: linear-gradient(135deg, #a855f7, #9333ea);
      transition: all 0.3s ease;
    }
    
    .btn-secondary:hover {
      background: linear-gradient(135deg, #c084fc, #a855f7);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(168, 85, 247, 0.4);
    }
    
    input, textarea, select {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(6, 182, 212, 0.3);
      transition: all 0.3s ease;
    }
    
    input:focus, textarea:focus, select:focus {
      border-color: #06b6d4;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
      outline: none;
    }
    
    .warranty-badge {
      background: linear-gradient(135deg, #10b981, #059669);
      animation: badge-glow 2s ease-in-out infinite alternate;
    }
    
    @keyframes badge-glow {
      from { box-shadow: 0 0 5px rgba(16, 185, 129, 0.5); }
      to { box-shadow: 0 0 20px rgba(16, 185, 129, 0.8); }
    }
    
    .page-transition {
      animation: fadeIn 0.3s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .toast {
      animation: slideIn 0.3s ease-out;
    }
    
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
  </style>

        stock: 22,
        featured: true
      }
    ];

    // ==================== UTILITY FUNCTIONS ====================
    function formatPrice(price) {
      return new Intl.NumberFormat('es-CO', {
        style: 'currency',
        currency: 'COP',
        minimumFractionDigits: 0
      }).format(price);
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColor = type === 'success' ? 'bg-emerald-500' : type === 'error' ? 'bg-red-500' : 'bg-cyan-500';
      toast.className = `toast glass ${bgColor}/90 px-4 py-3 rounded-lg text-white font-medium max-w-xs`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function toggleMobileMenu() {
      const menu = document.getElementById('mobile-menu');
      menu.classList.toggle('hidden');
    }

    // ==================== DATA SDK INTEGRATION ====================
    const dataHandler = {
      onDataChanged(data) {
        appState.orders = data.filter(d => d.type === 'order');
        appState.serviceRequests = data.filter(d => d.type === 'service');
        
        // Update UI if on relevant pages
        if (appState.currentPage === 'profile') {
          renderProfile();
        }
      }
    };

    // ==================== NAVIGATION ====================
    function navigate(page, data = null) {
      appState.currentPage = page;
      if (data) {
        if (page === 'product-detail') {
          appState.selectedProduct = data;
        }
      }
      renderPage();
      window.scrollTo(0, 0);
    }

    function renderPage() {
      const content = document.getElementById('main-content');
      
      switch (appState.currentPage) {
        case 'home':
          content.innerHTML = renderHome();
          break;
        case 'login':
          content.innerHTML = renderLogin();
          break;
        case 'register':
          content.innerHTML = renderRegister();
          break;
        case 'products':
          content.innerHTML = renderProducts();
          break;
        case 'product-detail':
          content.innerHTML = renderProductDetail();
          break;
        case 'services':
          content.innerHTML = renderServices();
          break;
        case 'cart':
          content.innerHTML = renderCart();
          break;
        case 'checkout':
          content.innerHTML = renderCheckout();
          break;
        case 'profile':
          content.innerHTML = renderProfile();
          break;
        default:
          content.innerHTML = renderHome();
      }
      
      updateAuthNav();
      updateCartBadge();
    }

    function updateAuthNav() {
      const authNav = document.getElementById('auth-nav');
      const mobileAuthNav = document.getElementById('mobile-auth-nav');
      
      if (appState.user) {
        authNav.innerHTML = `
          <div class="flex items-center gap-3">
            <button onclick="navigate('profile')" class="flex items-center gap-2 text-gray-300 hover:text-cyan-400 transition-colors">
              <div class="w-8 h-8 rounded-full bg-gradient-to-br from-cyan-400 to-purple-500 flex items-center justify-center text-sm font-bold">
                ${appState.user.name.charAt(0).toUpperCase()}
              </div>
              <span class="hidden lg:block">${appState.user.name}</span>
            </button>
            <button onclick="logout()" class="text-gray-400 hover:text-red-400 transition-colors text-sm">Salir</button>
          </div>
        `;
        mobileAuthNav.innerHTML = `
          <button onclick="navigate('profile'); toggleMobileMenu()" class="text-left text-gray-300 hover:text-cyan-400 py-2 font-medium w-full">👤 ${appState.user.name}</button>
          <button onclick="logout(); toggleMobileMenu()" class="text-left text-red-400 hover:text-red-300 py-2 font-medium w-full">🚪 Cerrar Sesión</button>
        `;
      } else {
        authNav.innerHTML = `<button onclick="navigate('login')" class="btn-primary px-4 py-2 rounded-lg font-semibold text-sm">Ingresar</button>`;
        mobileAuthNav.innerHTML = `<button onclick="navigate('login'); toggleMobileMenu()" class="btn-primary w-full px-4 py-2 rounded-lg font-semibold">Ingresar</button>`;
      }
    }

    function updateCartBadge() {
      const badge = document.getElementById('cart-badge');
      const count = appState.cart.reduce((sum, item) => sum + item.quantity, 0);
      if (count > 0) {
        badge.textContent = count;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    // ==================== AUTH FUNCTIONS ====================
    function handleLogin(e) {
      e.preventDefault();
      const form = e.target;
      const email = form.querySelector('#login-email').value;
      const password = form.querySelector('#login-password').value;
      
      if (!email || !password) {
        showToast('Por favor completa todos los campos', 'error');
        return;
      }
      
      // Simulate login
      appState.user = {
        id: generateId(),
        email: email,
        name: email.split('@')[0]
      };
      
      showToast('¡Bienvenido de vuelta!', 'success');
      navigate('home');
    }

    function handleRegister(e) {
      e.preventDefault();
      const form = e.target;
      const name = form.querySelector('#register-name').value;
      const email = form.querySelector('#register-email').value;
      const password = form.querySelector('#register-password').value;
      const confirmPassword = form.querySelector('#register-confirm').value;
      
      if (!name || !email || !password || !confirmPassword) {
        showToast('Por favor completa todos los campos', 'error');
        return;
      }
      
      if (password !== confirmPassword) {
        showToast('Las contraseñas no coinciden', 'error');
        return;
      }
      
      appState.user = {
        id: generateId(),
        email: email,
        name: name
      };
      
      showToast('¡Cuenta creada exitosamente!', 'success');
      navigate('home');
    }

    function handleGoogleLogin() {
      // Simulate Google login
      appState.user = {
        id: generateId(),
        email: 'usuario@gmail.com',
        name: 'Usuario Google'
      };
      
      showToast('¡Conectado con Google!', 'success');
      navigate('home');
    }

    function logout() {
      appState.user = null;
      showToast('Sesión cerrada', 'info');
      navigate('home');
    }

    // ==================== CART FUNCTIONS ====================
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      if (!product) return;
      
      const existingItem = appState.cart.find(item => item.productId === productId);
      
      if (existingItem) {
        existingItem.quantity++;
      } else {
        appState.cart.push({
          productId: product.id,
          name: product.name,
          price: product.price,
          image: product.image,
          quantity: 1
        });
      }
      
      updateCartBadge();
      showToast(`${product.name} agregado al carrito`, 'success');
    }

    function removeFromCart(productId) {
      appState.cart = appState.cart.filter(item => item.productId !== productId);
      updateCartBadge();
      renderPage();
      showToast('Producto eliminado del carrito', 'info');
    }

    function updateCartQuantity(productId, change) {
      const item = appState.cart.find(item => item.productId === productId);
      if (!item) return;
      
      item.quantity += change;
      if (item.quantity <= 0) {
        removeFromCart(productId);
      } else {
        updateCartBadge();
        renderPage();
      }
    }

    function getCartTotal() {
      return appState.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    }

    // ==================== CHECKOUT & SERVICE FUNCTIONS ====================
    async function handleCheckout(e) {
      e.preventDefault();
      
      if (!appState.user) {
        showToast('Debes iniciar sesión para continuar', 'error');
        navigate('login');
        return;
      }
      
      if (appState.cart.length === 0) {
        showToast('Tu carrito está vacío', 'error');
        return;
      }
      
      const form = e.target;
      const city = form.querySelector('#checkout-city').value;
      const address = form.querySelector('#checkout-address').value;
      
      if (!city || !address) {
        showToast('Por favor completa la dirección', 'error');
        return;
      }
      
      const isMedellin = city.toLowerCase().includes('medellín') || city.toLowerCase().includes('medellin');
      const deliveryType = isMedellin ? 'Entrega a Domicilio' : 'Envío Nacional';
      
      const orderData = {
        id: generateId(),
        type: 'order',
        user_email: appState.user.email,
        user_name: appState.user.name,
        product_id: appState.cart.map(i => i.productId).join(','),
        product_name: appState.cart.map(i => i.name).join(', '),
        quantity: appState.cart.reduce((sum, i) => sum + i.quantity, 0),
        price: getCartTotal(),
        status: 'pending',
        address: address,
        city: city,
        device_model: '',
        issue_description: deliveryType,
        created_at: new Date().toISOString()
      };
      
      try {
        const result = await window.dataSdk.create(orderData);
        if (result.isOk) {
          appState.cart = [];
          updateCartBadge();
          showToast(`¡Pedido realizado! ${deliveryType}`, 'success');
          navigate('profile');
        } else {
          showToast('Error al procesar el pedido', 'error');
        }
      } catch (err) {
        showToast('Error al procesar el pedido', 'error');
      }
    }

    async function handleServiceRequest(e) {
      e.preventDefault();
      
      if (!appState.user) {
        showToast('Debes iniciar sesión para continuar', 'error');
        navigate('login');
        return;
      }
      
      const form = e.target;
      const deviceModel = form.querySelector('#service-device').value;
      const issue = form.querySelector('#service-issue').value;
      const city = form.querySelector('#service-city').value;
      const address = form.querySelector('#service-address').value;
      
      if (!deviceModel || !issue || !city || !address) {
        showToast('Por favor completa todos los campos', 'error');
        return;
      }
      
      const isMedellin = city.toLowerCase().includes('medellín') || city.toLowerCase().includes('medellin');
      
      if (!isMedellin) {
        showToast('El servicio técnico a domicilio solo está disponible en Medellín', 'error');
        return;
      }
      
      const serviceData = {
        id: generateId(),
        type: 'service',
        user_email: appState.user.email,
        user_name: appState.user.name,
        product_id: '',
        product_name: '',
        quantity: 1,
        price: 0,
        status: 'scheduled',
        address: address,
        city: city,
        device_model: deviceModel,
        issue_description: issue,
        created_at: new Date().toISOString()
      };
      
      try {
        const result = await window.dataSdk.create(serviceData);
        if (result.isOk) {
          form.reset();
          showToast('¡Solicitud de servicio enviada!', 'success');
          navigate('profile');
        } else {
          showToast('Error al enviar solicitud', 'error');
        }
      } catch (err) {
        showToast('Error al enviar solicitud', 'error');
      }
    }

                    <div class="glass-card rounded-2xl p-4 flex gap-4">
                      <div class="w-20 h-20 bg-slate-800 rounded-xl flex items-center justify-center text-4xl flex-shrink-0">

                          class="w-full px-4 py-3 rounded-xl text-white placeholder-gray-500" required>

                        <span>Tarjeta de Crédito/Débito</span>

                      <label class="flex items-center gap-3 glass rounded-xl p-4 cursor-pointer hover:bg-white/5 transition-colors">

    function updateShippingInfo() {
      const city = document.getElementById('checkout-city')?.value;
      const infoDiv = document.getElementById('shipping-info');
      if (!infoDiv || !city) return;

      const isMedellin = city.toLowerCase().includes('medellín') || city.toLowerCase().includes('medellin');
      
      if (isMedellin) {
        infoDiv.innerHTML = `
          <div class="flex items-start gap-3">
            <span class="text-2xl">🏠</span>
            <div>
              <p class="font-medium text-cyan-400">Entrega a Domicilio</p>
              <p class="text-sm text-gray-400">Recibe tu pedido en 24-48 horas directamente en tu puerta</p>
            </div>
          </div>
        `;
      } else if (city) {
        infoDiv.innerHTML = `
          <div class="flex items-start gap-3">
            <span class="text-2xl">🚚</span>
            <div>
              <p class="font-medium text-purple-400">Envío Nacional</p>
              <p class="text-sm text-gray-400">Tu pedido llegará en 3-5 días hábiles por transportadora</p>
            </div>
          </div>
        `;
      }
    }

    // ==================== ELEMENT SDK INTEGRATION ====================
    async function onConfigChange(newConfig) {
      config = { ...defaultConfig, ...newConfig };
      
      // Update header
      const headerCompanyName = document.getElementById('header-company-name');
      if (headerCompanyName) headerCompanyName.textContent = config.company_name || defaultConfig.company_name;
      
      const headerTagline = document.getElementById('header-tagline');
      if (headerTagline) headerTagline.textContent = config.tagline || defaultConfig.tagline;
      
      // Update colors
      document.body.style.backgroundColor = config.background_color || defaultConfig.background_color;
      
      // Re-render page to apply changes
      renderPage();
    }

    function mapToCapabilities(config) {
      return {
        recolorables: [
          {
            get: () => config.background_color || defaultConfig.background_color,
            set: (value) => window.elementSdk.setConfig({ background_color: value })
          },
          {
            get: () => config.surface_color || defaultConfig.surface_color,
            set: (value) => window.elementSdk.setConfig({ surface_color: value })
          },
          {
            get: () => config.text_color || defaultConfig.text_color,

          },

          }
        ],
        borderables: [],

        fontSizeable: undefined
      };
    }

    function mapToEditPanelValues(config) {
      return new Map([
        ['company_name', config.company_name || defaultConfig.company_name],
        ['tagline', config.tagline || defaultConfig.tagline],
        ['warranty_text', config.warranty_text || defaultConfig.warranty_text]
      ]);
    }

    // ==================== INITIALIZATION ====================
    async function init() {
      // Initialize Element SDK
      if (window.elementSdk) {
        window.elementSdk.init({
          defaultConfig,
          onConfigChange,
          mapToCapabilities,
          mapToEditPanelValues
        });
      }

      // Initialize Data SDK
      if (window.dataSdk) {
        const result = await window.dataSdk.init(dataHandler);
        if (!result.isOk) {
          console.error('Failed to initialize Data SDK');
        }
      }

      // Render initial page
      renderPage();
    }

    // Start the app
    init();
